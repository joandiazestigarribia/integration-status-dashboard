# projectKey y organization tienen que coincidir con los que muestra SonarCloud
# al importar el repo (el key suele quedar como <organización>_<repo>).
sonar.projectKey=joandiazestigarribia_integration-status-dashboard
sonar.organization=joandiazestigarribia
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/__tests__/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Espera el resultado del quality gate y hace fallar el job si está en rojo:
# si algo no pasa el análisis, el pipeline no sigue.
sonar.qualitygate.wait=true
