name: CI

on:
  push:
    branches: [main]
  pull_request:

# Seguridad del pipeline:
# - El GITHUB_TOKEN solo puede leer el repo (mínimo privilegio).
# - Cada action está pinneada al SHA completo de un commit, con la versión como
#   comentario: un tag se puede mover a otro código, un SHA no. Es lo que
#   recomendó Aqua después del compromiso de trivy-action en marzo de 2026,
#   cuando atacantes reescribieron sus tags para robar secrets de los pipelines.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo para el análisis

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # LTS activa (Node 20 es EOL desde abril de 2026); la misma que el Dockerfile
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      # Requiere el secret SONAR_TOKEN configurado en el repo (Settings > Secrets).
      # Sin el secret, este paso se salta en vez de romper el pipeline para
      # quien clone el proyecto sin tener SonarCloud configurado. Con el secret,
      # espera el resultado del quality gate y falla si está en rojo
      # (sonar.qualitygate.wait en sonar-project.properties).
      - name: SonarCloud quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  container-scan:
    name: Build image + Trivy scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t integration-status-dashboard:${{ github.sha }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: integration-status-dashboard:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true # rompe solo por vulnerabilidades con fix disponible (accionables)
          exit-code: "1"
